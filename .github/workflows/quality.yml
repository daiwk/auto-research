name: Python quality

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"
      - ".github/workflows/paper-discovery.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"
      - ".github/workflows/paper-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,neural-recs,llm-evolution,plum]'
      - run: python -m compileall -q src tests scripts
      - run: ruff check src tests scripts
      - run: python -m pytest
      - run: python scripts/manage_paper_specs.py check
      - run: python scripts/manage_paper_specs.py validate
      - run: python scripts/generate_public_experiment_dashboard.py
      - run: git diff --exit-code -- docs/assets/data/experiment-dashboard.json
      - run: python scripts/generate_research_manifest.py
      - run: python scripts/generate_research_catalogs.py
      - run: git diff --exit-code -- docs/research-manifest.json docs/post-training docs/agent-research docs/foundation-models docs/reproductions/catalog
      - run: python scripts/migrate_metric_schema_v2.py
      - run: python scripts/audit_platform_completion.py
      - run: python scripts/validate_gpu_evidence.py
      - run: auto-research reproduce --write-manifest /tmp/papers.json
      - run: python -c "import json; p=json.load(open('/tmp/papers.json')); assert p['schema_version'] == 1 and len(p['papers']) >= 180"
