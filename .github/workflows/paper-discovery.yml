name: Paper discovery candidates

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Number of days to scan
        required: false
        default: "14"

permissions:
  contents: read

concurrency:
  group: paper-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The arXiv legacy API permits one connection and one request per three
      # seconds across our jobs, not one concurrent client per track.
      max-parallel: 1
      matrix:
        track: [recommendation, foundation-model, post-training, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Build high-recall candidate queue
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/discover_papers.py
          --track "${{ matrix.track }}"
          --lookback-days "$LOOKBACK_DAYS"
          --page-size 50
          --maximum-results-per-query 200
          --checkpoint-dir ".cache/paper-discovery/progress/${{ matrix.track }}"
          --output "paper-candidates-${{ matrix.track }}.json"
          --summary-output "paper-candidates-${{ matrix.track }}.md"
          --official-review-output "paper-official-review-${{ matrix.track }}.json"
          --cross-source-config configs/paper-discovery-sources.json
          --github-actions
      - name: Publish candidate diff
        if: always()
        run: cat "paper-candidates-${{ matrix.track }}.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: ${{ matrix.track }}-paper-candidates
          path: |
            paper-candidates-${{ matrix.track }}.json
            paper-candidates-${{ matrix.track }}.md
            paper-official-review-${{ matrix.track }}.json
            .cache/paper-discovery/progress/${{ matrix.track }}/
          retention-days: 30
