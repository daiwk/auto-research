[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-research"
version = "0.1.0"
description = "A local-first, reproducible research loop for ML topics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plum = ["torch>=2.7,<3", "transformers>=5.0,<6", "safetensors>=0.5"]
neural-recs = ["torch>=2.7,<3"]
llm-evolution = ["torch>=2.7,<3", "tokenizers>=0.21,<1"]
paper-figures = [
    "beautifulsoup4>=4.13,<5",
    "pillow>=11,<13",
    "pymupdf>=1.26,<2",
]

[project.scripts]
auto-research = "auto_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
