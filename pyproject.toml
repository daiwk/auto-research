[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_research"]

[project]
name = "auto-research"
version = "0.1.0"
description = "A local-first, reproducible research loop for ML topics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12,<1"]
plum = ["torch>=2.7.0a0,<3", "transformers>=5.0,<6", "safetensors>=0.5"]
neural-recs = ["torch>=2.7.0a0,<3"]
llm-evolution = ["torch>=2.7.0a0,<3", "tokenizers>=0.21,<1"]
multimodal = [
  "torch>=2.7.0a0,<3",
  "torchvision>=0.22,<1",
  "transformers>=5.0,<6",
  "huggingface-hub>=1.0,<2",
  "datasets>=4.0,<5",
  "Pillow>=11,<13",
  "soundfile>=0.13,<1",
  "yt-dlp>=2025.1",
  "num2words>=0.5,<1",
]
lmms-eval = [
  "lmms-eval==0.7.2",
]
post-training-gpu = [
  "torch>=2.7.0a0,<3",
  "transformers>=5.0,<6",
  "datasets>=4.0,<5",
  "safetensors>=0.5",
]
paper-figures = [
    "beautifulsoup4>=4.13,<5",
    "pillow>=11,<13",
    "pymupdf>=1.26,<2",
]

[project.scripts]
auto-research = "auto_research.cli:main"
auto-research-maintain = "auto_research.maintenance:main"
auto-research-install-runtime = "auto_research.dependency_guard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with correctness rules across the historical research corpus. Style
# families can be enabled per package as the large legacy modules are split.
select = ["E9", "F63", "F7", "F82"]
