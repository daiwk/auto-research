site_name: Auto Research
site_description: 面向搜广推、基础模型、LLM 后训练、Agent 和可扩展主题的论文实现与多轮自动进化平台
site_url: https://daiwk.github.io/auto-research/
repo_url: https://github.com/daiwk/auto-research
repo_name: daiwk/auto-research
edit_uri: edit/main/docs/

nav:
  - 首页: index.md
  - 自动研究与进化:
      - 能力总览: auto-research.md
      - 领域适配: evolution-domains.md
      - 多轮进化协议: model-evolution.md
      - UniRank 公共评测: unirank.md
  - 论文实现与评测:
      - 研究库总览: research-library.md
      - 发现闭环与防遗漏审计: paper-discovery-audit.md
      - 全主题缺口审计（2026-08-08）: full-domain-gap-review-20260808.md
      - 搜广推与 LLM 应用:
          - 研究总览: reproductions/industrial.md
          - 按公司浏览: reproductions/catalog/by-company.md
          - 按主题浏览: reproductions/catalog/by-topic.md
          - 按年月浏览: reproductions/catalog/by-month.md
          - 论文谱系与缺口: reproductions/lineage.md
          - 统一评测协议: reproductions/benchmark.md
      - 基础模型:
          - 研究总览: foundation-models/README.md
          - 按机构: foundation-models/catalog/by-organization.md
          - 按主题: foundation-models/catalog/by-topic.md
          - 按年份: foundation-models/catalog/by-year.md
          - 论文谱系与缺口: foundation-models/lineage.md
          - 统一评测协议: foundation-models/benchmark.md
      - LLM 后训练:
          - 研究总览: post-training/README.md
          - 方法索引: post-training/catalog.md
          - 按一作: post-training/catalog/by-first-author.md
          - 按主题: post-training/catalog/by-topic.md
          - 按年份: post-training/catalog/by-year.md
          - 论文谱系与缺口: post-training/lineage.md
          - 统一评测协议: post-training/benchmark.md
      - Agent:
          - 研究总览: agent-research/README.md
          - 方法索引: agent-research/catalog.md
          - 按一作: agent-research/catalog/by-first-author.md
          - 按主题: agent-research/catalog/by-topic.md
          - 按年份: agent-research/catalog/by-year.md
          - 论文谱系与缺口: agent-research/lineage.md
          - 统一评测协议: agent-research/benchmark.md
  - 项目文档:
      - 项目 README: project-readme.md
      - 架构与扩展: architecture.md
      - GPU 与 Linux CPU: runtime.md
      - 本地预览与发布: getting-started.md
      - 设计记录: design/automated-w2s-adoption.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

strict: true
